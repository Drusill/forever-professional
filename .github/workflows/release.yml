# Pushing a tag like v0.1.0 runs the tests, then packages the addon and uploads it to
# CurseForge (and as a GitHub release). A tag containing "beta" or "alpha" uploads a beta
# or alpha file instead of a release. Packaging rules: .pkgmeta.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover tests
      - run: python -m unittest discover tools/tests

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
